apiVersion: v1
kind: Secret
metadata:
  name: musedam-auto-tagging-secrets
  namespace: musedam-auto-tagging-prod
type: Opaque
stringData:
  DATABASE_URL: postgresql://replace-user:replace-password@replace-host:5432/musedam_auto_tagging?sslmode=require
  AUTH_SECRET: replace-with-random-secret
  CIPHER_PASSWORD: replace-with-random-secret
  INTERNAL_API_KEY: replace-with-random-secret
  AWS_ACCESS_KEY_ID: replace-with-aliyun-ram-access-key-id
  AWS_SECRET_ACCESS_KEY: replace-with-aliyun-ram-access-key-secret
  MUSEDAM_APP_API_KEY: replace-with-musedam-app-api-key
  MUSEDAM_APP_SECRET: replace-with-musedam-app-secret
  OPENAI_API_KEY: replace-with-model-gateway-api-key
  JINA_API_KEY: replace-with-jina-api-key
  LOGO_DETECTION_SERVER_TOKEN: replace-with-detection-token
  TRANSLATION_SERVICE_API_KEY: replace-with-translation-api-key
