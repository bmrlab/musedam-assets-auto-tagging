apiVersion: batch/v1
kind: Job
metadata:
  name: musedam-auto-tagging-migration-replace-version
  namespace: musedam-auto-tagging-prod
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: registry.example.com/musedam-auto-tagging-migration:replace-version
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: musedam-auto-tagging-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
