apiVersion: batch/v1
kind: Job
metadata:
  # Give every migration run a unique, versioned name -- Jobs are immutable,
  # so re-running the same name for a new deploy will fail to apply.
  name: musedam-auto-tagging-migration-replace-version
  namespace: musedam-auto-tagging-prod
  labels:
    app.kubernetes.io/name: musedam-auto-tagging
    app.kubernetes.io/instance: musedam-auto-tagging
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: musedam-auto-tagging
        app.kubernetes.io/instance: musedam-auto-tagging
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Uncomment and set if the customer ACR requires an image pull secret.
      # imagePullSecrets:
      #   - name: musedam-auto-tagging-registry
      containers:
        - name: migration
          image: registry.example.com/musedam-auto-tagging-migration:replace-version
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: musedam-auto-tagging-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
